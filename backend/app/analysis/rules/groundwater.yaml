# A27: „Wody gruntowe i wsiąkanie” – progi i teksty. Deterministycznie, bez AI.
#
# „Wsiąkanie” w tym kaflu = ile wody z opadu zostaje w glebie dla roślin (zasilanie zapasu), a NIE szybkość
# przesiąkania: na lekkiej glebie woda wsiąka szybko, ale ucieka w głąb – dla roślin zostaje mało, więc poziom jest
# „słabe / bardzo słabe”. Progi są ORIENTACYJNE (własne, z zadania A27) – do weryfikacji z agronomem.
groundwater:
  windows_days: [30, 60]        # okna przed datą analizy (tylko dane sprzed daty)
  min_valid_share: 0.8          # mniej ważnych dni w oknie – nie liczymy
  weight_30d: 0.7               # waga okna 30 dni w stosunku opad / parowanie (reszta: 60 dni)
  ratio_cap: 1.5                # stosunek opad / parowanie obcinamy (zimą parowanie jest bliskie zera)
  # jaka część opadu zostaje w zasięgu korzeni – wg kategorii podatności gleby na suszę IUNG (kod warstwy)
  soil_retention:
    1: 0.60     # kat. I – bardzo lekka
    2: 0.75     # kat. II – lekka
    3: 0.90     # kat. III – średnia
    4: 1.00     # kat. IV – ciężka
    5: 1.00     # gleba organiczna
    unknown: 0.85
  # spadek terenu (średni w obrysie): część wody spływa po powierzchni, zanim wsiąknie
  slope:
    moderate_pct: 3.0
    moderate_factor: 0.95
    steep_pct: 6.0
    steep_factor: 0.85
  # wskaźnik = (opad / parowanie) × część zatrzymana przez glebę × poprawka na spadek
  levels:
    dobre_min: 0.80
    slabe_min: 0.45             # niżej – „bardzo słabe”
  labels:
    dobre: "dobre wsiąkanie"
    slabe: "słabe wsiąkanie"
    bardzo_slabe: "bardzo słabe wsiąkanie"
  soil_words:
    1: "Bardzo lekka gleba"
    2: "Lekka gleba"
    3: "Średnia gleba"
    4: "Ciężka gleba"
    5: "Gleba organiczna"
    unknown: "Gleba bez określonej kategorii"
  # zdanie: „{soil} i {p30} mm opadu w 30 dni przy {e30} mm parowania – {tail}”
  sentence: "{soil} i {p30} mm opadu w 30 dni przy {e30} mm parowania – {tail}"
  tails:
    bardzo_slabe: "woda szybko schodzi w głąb albo paruje, mało zostaje dla roślin."
    bardzo_slabe_heavy: "prawie cały opad wyparowuje, mało zostaje dla roślin."
    slabe: "tylko część wody zostaje w glebie dla roślin."
    dobre: "opad uzupełnia zapas wody w glebie."
  slope_note: " Na stoku (średni spadek {s}%) część wody spływa po powierzchni."
  short: "Wsiąkanie: {label} ({p30} mm opadu w 30 dni przy {e30} mm parowania)."
  # połączenie z PIG-PIB (obszary zagrożone podtopieniami = doliny rzek z płytką wodą gruntową)
  wet_hollow_min_pct: 10.0      # od tylu % „mokrego dołka” w obrysie mówimy o ryzyku podtopień po ulewie
  interpretation:
    flood_and_hollow: "Działka leży na obszarze zagrożonym podtopieniami (PIG-PIB: dolina rzeki, płytka woda gruntowa), a {hollow}% jej powierzchni to obniżenia – ryzyko podtopień po ulewie."
    flood_zone: "Działka leży na obszarze zagrożonym podtopieniami (PIG-PIB: dolina rzeki, płytka woda gruntowa) – po mokrych okresach woda może stać w obniżeniach."
    no_flood_zone: "Działka nie leży na obszarze zagrożonym podtopieniami wg PIG-PIB."
    may_reduce_drought: " Płytka woda gruntowa może zasilać korzenie – susza może być mniejsza niż z bilansu."
