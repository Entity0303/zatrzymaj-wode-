# Werdykt działki (A5b-2b, D68): szablony zdań i progi dobrze / uwaga / źle. Deterministycznie – bez AI.
# Klucz `verdict` (nie `rules`) – silnik rekomendacji tego pliku nie wczytuje. Wartości w {} wylicza analysis/verdict.py.
verdict:
  thresholds:
    # norma opadów dla Polski (IMGW, wielolecie ok. 600 mm/rok; półrocze IV–IX ok. 60%) – szacunek do porównań
    precip_norm_year_mm: 600
    precip_norm_season_mm: 370
    precip_low_ratio: 0.85          # rok < 85% normy = mało opadów (uwaga)
    # „w maju–czerwcu brakowało wody”: klimatyczny bilans wodny (opad − ET0) V–VI < −100 mm
    kbw_may_june_deficit_mm: -100
    deficit_years_warn: 3           # ≥ 3 z 10 lat = uwaga
    deficit_years_bad: 5            # ≥ 5 z 10 lat = źle
    terrain_zone_min_pct: 15        # strefy terenu w zdaniu: ≥ 15% działki (najwyżej 2)
    crops_good_max: 4
    crops_good_min: 2
    crops_bad_max: 4
    # A14: gleba „lekka” z mapy (tekstura), ale WOD całej działki (z niego liczy się model i ranking) ≥ 150 mm (górna
    # część kat. II wg IUNG) – ocena „uwaga”, nie „źle”; nagłówek nie może przeczyć rankingowi
    soil_light_warn_wod_mm: 150
    water_actions_max: 3

  soil:
    lekka: {level: bad, text: "Gleba lekka – {opis}, mało trzyma wody: zmieści ok. {wod} mm wody."}
    lekka_warn: {level: warn, text: "Gleba lżejsza – {opis}, ale cała działka zmieści ok. {wod} mm wody – przeciętnie."}
    srednia: {level: ok, text: "Gleba średnia – {opis}, dobrze trzyma wodę: zmieści ok. {wod} mm wody."}
    ciezka: {level: ok, text: "Gleba ciężka – {opis}, trzyma dużo wody (zmieści ok. {wod} mm), ale po długich deszczach wolno obsycha."}
    organiczna: {level: warn, text: "Gleba organiczna (torf, mursz) – dużo wody, ale latem przesycha i osiada; wymaga ostrożnej uprawy."}
    nieznana: {level: warn, text: "Brak dokładnych danych o glebie – ocena wody przybliżona."}
    two_soils: "Na działce są dwie gleby: {a_pct}% – {a_name} i {b_pct}% – {b_name}."
    two_soils_tail:
      lekka: "Przeważa gleba lekka – mało trzyma wody: działka zmieści ok. {wod} mm wody."
      lekka_warn: "Przeważa gleba lekka, ale cała działka zmieści ok. {wod} mm wody – przeciętnie."
      srednia: "Przeważa gleba średnia – dobrze trzyma wodę: działka zmieści ok. {wod} mm wody."
      ciezka: "Przeważa gleba ciężka – trzyma dużo wody: działka zmieści ok. {wod} mm wody."

  precip:
    ok: "Opady wystarczają – w maju–czerwcu brakowało wody tylko w {deficit_years} z {years} lat; średnio {year_mm} mm opadów na rok ({season_mm} mm od kwietnia do września)."
    ok_none: "Opady wystarczają – w maju–czerwcu ani razu nie brakowało wody w ostatnich {years} latach; średnio {year_mm} mm opadów na rok ({season_mm} mm od kwietnia do września)."
    warn: "W maju–czerwcu często brakuje wody – w {deficit_years} z {years} lat; średnio {year_mm} mm opadów na rok ({season_mm} mm od kwietnia do września)."
    low: "Opady niskie – średnio {year_mm} mm na rok ({season_mm} mm od kwietnia do września); w maju–czerwcu brakowało wody w {deficit_years} z {years} lat."
    bad: "Opady za niskie wiosną – w {deficit_years} z {years} lat w maju–czerwcu brakowało wody; średnio {year_mm} mm opadów na rok ({season_mm} mm od kwietnia do września)."
    # porównanie z normą neutralnie: NASA POWER (PRECTOTCORR, ~50 km) daje ok. 15–20% więcej niż normy stacji IMGW
    norm_tail: " Dla porównania: średnio w Polsce ok. {norm_mm} mm na rok."
    # A7: opad ze stacji IMGW – porównanie z normą wprost
    norm_low: " To mniej niż średnio w Polsce (ok. {norm_mm} mm na rok) – pomiar ze stacji IMGW."
    norm_high: " To więcej niż średnio w Polsce (ok. {norm_mm} mm na rok) – pomiar ze stacji IMGW."
    norm_same: " To tyle, co średnio w Polsce (ok. {norm_mm} mm na rok) – pomiar ze stacji IMGW."
    # A18: przy brakach wody wiosną – roczna suma nie przeczy pierwszemu zdaniu
    norm_same_dry: " Przez cały rok pada tyle, co średnio w Polsce (ok. {norm_mm} mm), ale w maju–czerwcu to za mało – pomiar ze stacji IMGW."
    norm_high_dry: " Przez cały rok pada więcej niż średnio w Polsce (ok. {norm_mm} mm), ale w maju–czerwcu to za mało – pomiar ze stacji IMGW."

  crops:
    best: "Najmniej ryzykowne tu są: {best}."
    best_possible: "Najlepiej wypadają tu {best}, ale w suche lata i one tracą."
    # A18: rok najsłabszego plonu pszenicy w symulacji – to nie musi być najsuchszy rok
    wheat_dry_year: " Nawet w najgorszym dla pszenicy roku ({year}) straciłaby tu tylko ok. {loss}% plonu."
    wheat_dry_year_big: " W najgorszym dla pszenicy roku ({year}) straciłaby tu ok. {loss}% plonu."
    wheat_small_loss_max_pct: 20  # „tylko” – gdy strata w najgorszym roku ≤ 20%
    bad: "Tu nie siej {bad} – {reason}."
    none_bad: " Na tej ziemi żadna z popularnych upraw nie jest odradzana."
    instead: "Siej {instead}."
    reasons:
      gleba_lekka: "za mało wody na tej glebie"
      gleba: "ta gleba im nie pasuje"
      gleba_kompleks: "według mapy glebowo-rolniczej ta gleba im nie służy"  # A15, A18
      woda: "susza zbyt często zabiera ponad 20% plonu"
      plodozmian: "za krótka przerwa w płodozmianie"

  water:
    text: "Co zrobić z wodą: {actions}."
    none: "Co zrobić z wodą: zostaw na polu resztki roślin i nie zostawiaj gołej ziemi – więcej wody wsiąknie zamiast spłynąć."

  terrain_missing: "Brak danych o ukształtowaniu terenu – nie wiemy, skąd woda spływa i gdzie się zbiera. Spróbuj ponownie za chwilę."
  terrain_pending: "Liczę ukształtowanie terenu – za chwilę pokażę, skąd woda spływa i gdzie się zbiera."

  chosen_crop: "{crop} ({phase}): {headline}."
  # A5e (D79): przed siewem / po zbiorze uprawy nie ma w polu – zdanie mówi o stanie działki, nie o uprawie
  chosen_crop_off: "{crop} – teraz {phase}, uprawy nie ma w polu. Stan wody na działce: {headline}."

  # Nagłówek – pierwsza pasująca reguła (warunki: poziomy pozycji, liczba „źle”, udziały stref terenu)
  headlines:
    # A14: „Słaba…” tylko, gdy ranking coś odradza (uprawy ≠ ok) – inaczej nagłówek przeczyłby rankingowi
    - {if: {gleba: bad, opady: bad, uprawy_not: ok}, text: "Słaba, sucha działka – siej rośliny odporne na suszę"}
    - {if: {gleba: bad, uprawy_not: ok}, text: "Słaba, piaszczysta działka – siej rośliny odporne na suszę"}
    - {if: {bad_count_gte: 2}, text: "Trudna działka – mało wody dla wymagających upraw"}
    # A14/A15: „Trudna” tylko przy złych opadach ORAZ (ranking „źle” ALBO gleba gorsza niż ok) – same „uwaga” przy dobrej
    # glebie (np. kilka odradzanych upraw) nie dają tego nagłówka (Stryjno, Szczytno 126/3 – „Ziemia dobra”)
    - {if: {opady: bad, uprawy: bad}, text: "Trudna działka – mało wody dla wymagających upraw"}
    - {if: {opady: bad, gleba: [warn, bad]}, text: "Trudna działka – mało wody dla wymagających upraw"}
    - {if: {gleba: ok, opady: [ok, warn], dry_pct_gte: 30}, text: "Dobra działka z suchą górką"}
    - {if: {gleba: ok, opady: [ok, warn], wet_pct_gte: 15}, text: "Dobra działka z wilgotnym obniżeniem"}
    - {if: {gleba: ok, opady: ok}, text: "Dobra działka – trzyma wodę"}
    - {if: {gleba: ok}, text: "Dobra ziemia, ale w suche lata brakuje wody"}
    - {if: {}, text: "Przeciętna działka – uważaj w suche lata"}

  # forma „czego” (nie siej …) i „co” (siej …)
  genitive:
    pszenica_ozima: "pszenicy ozimej"
    zyto: "żyta"
    pszenzyto_ozime: "pszenżyta"
    jeczmien_ozimy: "jęczmienia ozimego"
    jeczmien_jary: "jęczmienia jarego"
    owies: "owsa"
    lubin: "łubinu"
    rzepak: "rzepaku"
    kukurydza_ziarno: "kukurydzy na ziarno"
    kukurydza_kiszonka: "kukurydzy na kiszonkę"
    ziemniak: "ziemniaków"
    burak_cukrowy: "buraków cukrowych"
    straczkowe: "roślin strączkowych"
    warzywa: "warzyw"
    zboza_ozime: "zbóż ozimych"
    zboza_jare: "zbóż jarych"
    rzepak_jesien: "rzepaku"
    chmiel: "chmielu"
    tyton: "tytoniu"
    drzewa_owocowe: "drzew owocowych"
    krzewy_owocowe: "krzewów owocowych"
    truskawki: "truskawek"
  accusative:
    pszenica_ozima: "pszenicę ozimą"
    zyto: "żyto"
    pszenzyto_ozime: "pszenżyto"
    jeczmien_ozimy: "jęczmień ozimy"
    jeczmien_jary: "jęczmień jary"
    owies: "owies"
    lubin: "łubin"
    rzepak: "rzepak"
    kukurydza_ziarno: "kukurydzę na ziarno"
    kukurydza_kiszonka: "kukurydzę na kiszonkę"
    ziemniak: "ziemniaki"
    burak_cukrowy: "buraki cukrowe"
    straczkowe: "rośliny strączkowe"
    warzywa: "warzywa"
    zboza_ozime: "zboża ozime"
    zboza_jare: "zboża jare"
    rzepak_jesien: "rzepak"
    chmiel: "chmiel"
    tyton: "tytoń"
    drzewa_owocowe: "drzewa owocowe"
    krzewy_owocowe: "krzewy owocowe"
    truskawki: "truskawki"
  # rodzaj gramatyczny nazwy (label) – do „rosła / rósł / rosło / rosły” (A5e-2): f, m, n, pl
  gender:
    pszenica_ozima: f
    kukurydza_ziarno: f
    kukurydza_kiszonka: f
    zyto: n
    pszenzyto_ozime: n
    jeczmien_ozimy: m
    jeczmien_jary: m
    owies: m
    lubin: m
    ziemniak: m
    burak_cukrowy: m
    chmiel: m
    tyton: m
    rzepak: pl
    rzepak_jesien: pl
    straczkowe: pl
    warzywa: pl
    drzewa_owocowe: pl
    krzewy_owocowe: pl
    truskawki: pl
    zboza_ozime: pl
    zboza_jare: pl
  # najczęściej siane uprawy polowe – pierwszeństwo na liście ❌ (żeby rolnik od razu zobaczył swoje)
  popular: [pszenica_ozima, rzepak, kukurydza_ziarno, jeczmien_jary, jeczmien_ozimy, pszenzyto_ozime, zyto, ziemniak,
            burak_cukrowy, owies, kukurydza_kiszonka, lubin, straczkowe, warzywa]
