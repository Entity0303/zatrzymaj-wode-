# Teren × gleba (A6 D58, poprawione w A5b-2b D66): ocena każdej strefy terenu z NMT razem z glebą + jedno zdanie.
# Klucz główny `teren_gleba` (nie `rules`) – silnik rekomendacji (recommendations.py) tego pliku nie wczytuje.
# Gleba (analysis/soil_label.py – etykieta ważona udziałem gatunków z mapy glebowo-rolniczej / kategorii IUNG):
#   lekka (piaski, kat. I–II), srednia (gliny lekkie, pyły, kat. III), ciezka (gliny ciężkie, iły, kat. IV),
#   organiczna (torfy, mursze), nieznana. Dawne „zwiezla” (III + IV razem) – usunięte: glina lekka to nie gleba zwięzła.
# Strefa „dołek” = OBNIŻENIE, do którego spływa i gdzie zbiera się woda (TPI / TWI) – wilgotniej, po ulewach może być
# podmokło. To NIE to samo co „zagłębienie bez odpływu” (priority-flood) – o nim mówimy tylko, gdy jest (D66).
# Logika: obniżenie na piasku = plus (najwilgotniej w suszy), na glinie ciężkiej = minus (woda stoi, wymakanie);
# górka na piasku = najgorzej. Szablon: {pct} – udział strefy w działce (%). Strefa < 1% – bez oceny i zdania.
# rating: dobrze | uwaga | zle

labels:
  sucha_gorka: "górka – sucho"
  stok: "stok – woda ucieka"
  plasko: "płasko – dobre warunki"
  mokry_dolek: "obniżenie – zbiera się woda"

colors:  # uzgodnione z B (contract-changes A6)
  sucha_gorka: "#8B6B4A"
  stok: "#E8B931"
  plasko: "#5BB37F"
  mokry_dolek: "#2F80C9"

soil_groups:
  lekka: "gleba lekka"
  srednia: "gleba średnia"
  ciezka: "gleba ciężka"
  organiczna: "gleba organiczna"
  nieznana: "gleba nieznana"

teren_gleba:
  sucha_gorka:
    lekka:
      rating: zle
      sentence: "{pct}% działki to górka na lekkiej glebie – najsuchsze miejsce – w suche lata rośliny zwykle cierpią tu najpierw."
    srednia:
      rating: uwaga
      sentence: "{pct}% działki to górka – najsuchsze miejsce na działce – w suche lata rośliny zwykle cierpią tu najpierw."
    ciezka:
      rating: uwaga
      sentence: "{pct}% działki to górka – najsuchsze miejsce na działce, choć ciężka gleba trzyma wodę dłużej."
    organiczna:
      rating: uwaga
      sentence: "{pct}% działki to górka – najsuchsze miejsce na działce."
    nieznana:
      rating: uwaga
      sentence: "{pct}% działki to górka – najsuchsze miejsce na działce."
  stok:
    lekka:
      rating: uwaga
      sentence: "{pct}% działki to stok – woda z ulewy ucieka w dół, a lekka gleba zatrzymuje jej mało."
    srednia:
      rating: uwaga
      sentence: "{pct}% działki to stok – po ulewie część wody spływa w dół i zabiera glebę."
    ciezka:
      rating: uwaga
      sentence: "{pct}% działki to stok – ciężka gleba wolno chłonie wodę, po ulewie dużo jej spływa."
    organiczna:
      rating: uwaga
      sentence: "{pct}% działki to stok – po ulewie część wody spływa w dół."
    nieznana:
      rating: uwaga
      sentence: "{pct}% działki to stok – po ulewie część wody spływa w dół."
  plasko:
    lekka:
      rating: dobrze
      sentence: "{pct}% działki to teren płaski – woda rozkłada się równo (na lekkiej glebie i tak przesycha szybciej)."
    srednia:
      rating: dobrze
      sentence: "{pct}% działki to teren płaski – zwykle dobre warunki wodne."
    ciezka:
      rating: dobrze
      sentence: "{pct}% działki to teren płaski – dobre warunki, ale po długich deszczach woda wolno wsiąka."
    organiczna:
      rating: dobrze
      sentence: "{pct}% działki to teren płaski – woda rozkłada się równo."
    nieznana:
      rating: dobrze
      sentence: "{pct}% działki to teren płaski – woda rozkłada się równo."
  mokry_dolek:
    lekka:
      rating: dobrze
      sentence: "{pct}% działki to obniżenie, gdzie spływa i zbiera się woda – na lekkiej glebie to zwykle najwilgotniejsze miejsce w suszy."
    srednia:
      rating: uwaga
      sentence: "{pct}% działki to obniżenie, gdzie spływa i zbiera się woda – wilgotniej, po ulewach może być podmokło."
    ciezka:
      rating: zle
      sentence: "{pct}% działki to obniżenie, gdzie spływa i zbiera się woda – na ciężkiej glebie po ulewach i wiosną stoi tu woda, uprawy mogą wymakać."
    organiczna:
      rating: uwaga
      sentence: "{pct}% działki to obniżenie, gdzie zbiera się woda – często podmokło."
    nieznana:
      rating: uwaga
      sentence: "{pct}% działki to obniżenie, gdzie spływa i zbiera się woda – wilgotniej, po ulewach może być podmokło."
