# Ranking „Co tu posiać?” (A5b-2a, D61–D62) – współczynniki i progi. To SZACUNKI do kalibracji z agronomem.
# Klucz `ranking` – silnik rekomendacji (recommendations.py) tego pliku nie wczytuje.
ranking:
  # Plon potencjalny Ym = percentyl plonów GUS w województwie (10 lat) × współczynnik gleby
  gus_percentile: 90
  # A21: widełki wyniku – warianty danych wejściowych (analysis/variants.py)
  variants:
    precip_pct: 10        # gdy głównym źródłem opadu jest NASA: opad −10% / +10%
    wod_open_pct: 20      # kat. I i IV (przedział otwarty) albo WOD spoza przedziału kategorii: ±20% WOD z modelu
    wide_risk_years: 4    # A22: rozrzut lat ze stratą > 20% między wariantami ≥ 4 → pewność uprawy o poziom niżej
  # A16: tylko plony GUS z lat < rok daty analizy; Ym(rok sezonu) = trend liniowy plonów województwa × P90 reszt
  # względnych (plon / trend; trend Theil–Sen – odporny na pojedyncze lata suszy) – bez trendu lata 2016–2019 były zawyżone, a 2023–2025 zaniżone (GUS +25–40% w 10 lat)
  yield_trend:
    min_years: 5          # mniej lat GUS – bez trendu (P90 surowych plonów)
    max_slope_pct: 3.0    # trend przycięty do ±3% średniej plonu na rok
  # A7 (D84): korekta progu Ym po przejściu na opad ze stacji IMGW (suchszy o 14–23% niż NASA POWER) – tylko uprawy,
  # których średni plon symulowany na przeciętnej glebie odbiegał od średniej GUS o więcej niż ±15%
  # (scripts/calibrate_ranking.py: podlaskie, lubelskie, wielkopolskie, kujawsko-pomorskie). Ky z danych C bez zmian.
  ym_adjust:
    straczkowe: 1.15        # było −16…−25% → −3…−14%
    ziemniak: 1.08          # było −4…−19% → +4…−12%
    drzewa_owocowe: 0.85    # było +8…+30% → −8…+10% (krótka, niejednorodna seria GUS)
  # Przydatność gleby działki dla uprawy (kolumny gleby_odpowiednie / gleby_nieodpowiednie w crops.csv):
  # „neutralna” = przeciętna gleba województwa (kalibracja do średniej GUS)
  soil_factor:
    odpowiednia: 1.08
    neutralna: 1.00
    nieodpowiednia: 0.75
  loss_threshold: 0.20        # „rok suszy” = strata plonu > 20%
  # kategorie
  recommended:                # ✅ polecane: gleba odpowiednia i …
    max_risk_years: 3         # … strata > 20% najwyżej w 3 z 10 lat
    min_median_relative: 0.80 # … i typowy plon ≥ 80% plonu odniesienia
  discouraged:                # ❌ odradzane: gleba nieodpowiednia, złamany płodozmian albo (gleba przeciętna i …)
    min_risk_years: 5         # … strata > 20% w co najmniej połowie lat
    max_median_relative: 0.70 # … albo typowy plon < 70% plonu odniesienia)
  # Gleba ODPOWIEDNIA nigdy nie daje „odradzane” z powodu wody – najwyżej „możliwe” (na słabej ziemi
  # coś trzeba posiać: żyto, łubin)
  # ocena do kolejności w kategorii: 100 × mediana plonu względnego − kara × lata ryzyka + gleba + płodozmian
  score:
    risk_year_penalty: 4
    soil_bonus: {odpowiednia: 8, neutralna: 0, nieodpowiednia: -25}
    rotation_plus: 5
    rotation_warning: -8
  min_seasons: 5              # mniej pełnych sezonów z danymi = brak pozycji w rankingu
