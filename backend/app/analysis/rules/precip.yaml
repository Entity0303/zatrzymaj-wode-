# Opad dla działki (A7, D82–D83): progi i zdania. Deterministycznie, bez AI.
precip:
  thresholds:
    agree_ok: 0.15            # rozrzut sum (max − min) / średnia ≤ 15% = „zgodne”
    agree_warn: 0.35          # ≤ 35% = „różnią się”, więcej = „mocno się różnią” (pewność o poziom niżej)
    min_sum_mm: 20            # mianownik rozrzutu nie mniejszy niż 20 mm (1 mm vs 3 mm to nie „mocno się różnią”)
    window_min_valid: 0.9     # okno porównania: ≥ 90% dni z danymi w obu źródłach
    factor_min_days: 180      # współczynnik IMGW/NASA: co najmniej 180 wspólnych dni …
    factor_min: 0.5           # … i w rozsądnych granicach
    factor_max: 1.5
    same_pct: 5               # różnica wielolecia do 5% = „zgodne z pomiarem”
  # A16: rozjazd w sezonie – suma IV–VII ze stacji (IDW) vs surowa NASA, rok po roku
  season_disagreement:
    months: [4, 7]            # kwiecień–lipiec (pełny okres – tylko sezony zakończone przed datą analizy)
    min_valid: 0.9            # ≥ 90% dni okresu z danymi w obu źródłach
    max_pct: 30               # |IMGW − NASA| / NASA > 30% → rok oznaczony
    recent_years: 5           # pewność o poziom niżej, gdy oznaczonych lat „station” ≥ 2 z ostatnich 5
    recent_min: 2
    # A16b: kto się myli? Stacje działki vs mediana POZOSTAŁYCH stacji do 50 km (ta sama suma IV–VII)
    neighbour_km: 50
    neighbour_min: 2          # mniej sąsiadów z pełnym okresem → nie wiadomo – traktujemy jak „station”
    neighbour_agree_pct: 25   # |stacje − mediana sąsiadów| / mediana ≤ 25% → stacje wiarygodne, zawyża / zaniża NASA
  labels:
    zgodne: "zgodne"
    roznia_sie: "różnią się"
    mocno_sie_roznia: "mocno się różnią"
    brak_danych: "brak danych do porównania"
  main_labels:
    imgw: "stacje IMGW (do 30 km)"
    imgw_daleko: "stacje IMGW (30–50 km)"
    nasa: "NASA POWER (siatka ok. 50 km)"
  windows:
    sezon: "sezon od 1 marca"
    ostatnie_30_dni: "ostatnie 30 dni"
    wielolecie: "wspólne lata"
  sentences:
    one: "Opady liczymy ze stacji IMGW {stations}."
    many: "Opady liczymy ze stacji IMGW: {stations}."
    far: "Najbliższe stacje IMGW są daleko ({stations}) – opad dla tej działki jest mniej pewny."
    nasa_more: " Dane satelitarno-modelowe NASA pokazują o {pct}% więcej – przyjmujemy pomiar ze stacji."
    nasa_less: " Dane satelitarno-modelowe NASA pokazują o {pct}% mniej – przyjmujemy pomiar ze stacji."
    nasa_same: " Dane satelitarno-modelowe NASA są zgodne z pomiarem (różnica {pct}%)."
    strong: " W tym sezonie źródła mocno się różnią – możliwe lokalne burze; sprawdź deszczomierz na polu."
    # A20: zdanie główne = stacje + najwyżej jedno zdanie (lokalne burze / odstająca stacja / uzupełnione ostatnie dni);
    # porównania procentowe z NASA i lata rozjazdu – w `details` (szczegóły źródeł, tryb Doradca)
    filled: " {span} to dane satelitarne NASA dopasowane do {target}, bo archiwum IMGW ich jeszcze nie ma."
    filled_target: ["tej stacji", "tych stacji"]
    nasa_outdated_factor: "Najbliższa stacja IMGW {station} ({km}) nie ma aktualnych danych (pomiary do {last}) – opady z danych satelitarno-modelowych NASA przeliczonych do poziomu tej stacji (×{factor}); pewność niższa."
    nasa_outdated: "Najbliższa stacja IMGW {station} ({km}) nie ma aktualnych danych (pomiary do {last}) – opady z danych satelitarno-modelowych NASA (siatka ok. 50 km); pewność niższa."
    nasa_only: "W promieniu 50 km nie ma stacji IMGW z danymi – opady z danych satelitarno-modelowych NASA (siatka ok. 50 km); na nizinach zwykle zawyżają one opad o 15–20%."
    disagree_nasa: " W {years} dane satelitarne NASA pokazują ok. {pct}% {direction} opadu niż stacje IMGW w okolicy – przyjmujemy pomiar ze stacji."
    disagree: " W {years} {who} o ok. {pct}% {direction} opadu niż dane satelitarne – wynik dla {which} jest mniej pewny."
    disagree_mixed: " W {years} {who_mixed} od danych satelitarnych o ok. {pct}% opadu – wynik dla {which} jest mniej pewny."
    disagree_who: ["stacja IMGW pokazuje", "stacje IMGW pokazują"]
    disagree_who_mixed: ["stacja IMGW różni się", "stacje IMGW różnią się"]
    disagree_which: ["tego roku", "tych lat"]
    nasa_no_store: "Opady z danych satelitarno-modelowych NASA (siatka ok. 50 km) – dane ze stacji IMGW są niedostępne."
